<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WildX · Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1F4D43}a:hover{color:#173B33}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #1F4D43;outline-offset:2px}
</style>
</head>
<body>
<div style="min-height: 100vh; box-sizing: border-box; padding: 28px 16px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; font-family: 'Geist', system-ui, sans-serif; color: #16201B; font-size: 14px">
<div style="width: 100%; max-width: 1120px; display: flex; flex-wrap: wrap; gap: 12px; padding: 12px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E4E7E0; border-radius: 18px">

<div style="position: relative; flex: 1 1 360px; min-height: 260px; border-radius: 14px; overflow: hidden; background: #E6EED9; display: flex; flex-direction: column; justify-content: space-between; padding: 28px; box-sizing: border-box">
<img src="https://images.unsplash.com/photo-1674556275226-47b6b393d623?ixlib=rb-4.1.0&amp;q=85&amp;fm=jpg&amp;crop=entropy&amp;cs=srgb&amp;w=1600" alt="Mother and calf elephant grazing in Udawalawe National Park" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 30% center">
<p style="position: relative; margin: 0; max-width: 340px; font-size: 32px; line-height: 38px; font-weight: 600; letter-spacing: -0.02em; color: #16201B">Every herd, patrol and alert in one calm view.</p>
<span style="position: relative; align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: #16201B; background: #FFFFFF; border: 1px solid #E4E7E0; border-radius: 6px; padding: 4px 8px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>Udawalawe NP · 30,821 ha</span>
</div>

<div style="flex: 1 1 360px; display: flex; align-items: center; justify-content: center; padding: 40px 24px; box-sizing: border-box">
<form style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 34px; height: 34px; border-radius: 10px; background: #1F4D43; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4C11 4.5 19 11 20 20C13 19.5 5 13 4 4Z" fill="#D5EE9B"></path><path d="M20 4C19.5 11 13 19 4 20C4.5 13 11 5 20 4Z" fill="#D5EE9B" fill-opacity="0.6"></path></svg>
</div>
<span style="font-size: 23px; font-weight: 600; letter-spacing: -0.03em; color: #16201B">Wild<span style="font-weight: 700; color: #1F4D43">X</span></span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 600; letter-spacing: -0.02em">Sign in</h1>
<p style="margin: 0; font-size: 15px; color: #3B433E">Welcome back. Sign in to the park console.</p>
</div>

<div style="border-top: 1px solid #E4E7E0"></div>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #3B433E">Work email
<input type="email" value="h.jayasekara@dwc.gov.lk" style="height: 40px; padding: 0 12px; border: 1px solid #DADDD4; border-radius: 10px; background: #FFFFFF; color: #16201B; font-size: 14px; font-weight: 400; box-sizing: border-box; width: 100%">
</label>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #3B433E"><span style="display: flex"><span style="margin-right: auto">Password</span><a href="#" style="font-size: 13px; font-weight: 500">Forgot password?</a></span>
<input type="password" value="wildxpatrol" style="height: 40px; padding: 0 12px; border: 1px solid #1F4D43; box-shadow: 0 0 0 3px #E9F1DA; border-radius: 10px; background: #FFFFFF; color: #16201B; font-size: 14px; font-weight: 400; box-sizing: border-box; width: 100%">
</label>

<label style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #3B433E"><input type="checkbox" checked style="width: 16px; height: 16px; margin: 0; accent-color: #1F4D43">Keep me signed in on this device</label>

<button type="submit" style="height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: #1F4D43; color: #FFFFFF; font-size: 15px; font-weight: 500; cursor: pointer">Sign in</button>

<p style="margin: 0; text-align: center; font-size: 14px; color: #6B726C">New to WildX? <a href="#" style="font-weight: 500; color: #1F4D43">Create an account</a></p>
</form>
</div>

</div>
</div>
</body>
</html>
