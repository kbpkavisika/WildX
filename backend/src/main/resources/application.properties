spring.application.name=WildX
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

wildx.jwt-secret=${JWT_SECRET}
wildx.ingest-api-key=${INGEST_API_KEY:}
wildx.upload-dir=${UPLOAD_DIR:./uploads}

wildx.sms.textbee.api-key=${TEXTBEE_API_KEY:}
wildx.sms.textbee.device-id=${TEXTBEE_DEVICE_ID:}
wildx.sms.textbee.base-url=${TEXTBEE_BASE_URL:https://api.textbee.dev}
wildx.sms.short-code=${SMS_SHORT_CODE:8800}
